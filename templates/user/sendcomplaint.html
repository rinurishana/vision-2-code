<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Complaint</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", sans-serif;
}

/* PAGE BACKGROUND */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020024,#001f4d,#000000);
}

/* CONTAINER */

.container{
width:450px;
padding:35px;
border-radius:14px;

background:linear-gradient(145deg,#0a1f44,#000000);

box-shadow:0 0 30px rgba(0,0,0,0.7);
color:white;
border:1px solid rgba(255,255,255,0.08);
}

/* TITLE */

h2{
text-align:center;
margin-bottom:20px;
color:#4da6ff;
}

/* LABEL */

label{
font-weight:bold;
display:block;
margin-bottom:8px;
color:#bbb;
}

/* TEXTAREA */

textarea{
width:100%;
height:120px;
padding:12px;
border:none;
border-radius:8px;
resize:none;
font-size:14px;

background:#08142e;
color:white;
outline:none;
}

/* BUTTON */

button{
width:100%;
margin-top:18px;
padding:12px;
border:none;
border-radius:8px;

background:linear-gradient(90deg,#0d6efd,#003c9e);

color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:linear-gradient(90deg,#0b5ed7,#002e7a);
}
    .back-link{
color:white;
text-decoration:none;
font-weight:500;
}

.back-link:hover{
color:#4da6ff;
}

</style>
</head>

<body>

{% include "msgalert.html" %}

<div class="container">


<h2>Add Complaint</h2>

<form method="post" action="/myapp/user_send_comp_post">
{% csrf_token %}
<label for="complaint">Complaint</label>

<textarea id="complaint" placeholder="Type your complaint here..." name="complaint"></textarea>

<button type="submit">Send</button>
<a href="/myapp/user_home" class="back-link">← Back to Dashboard</a>
</form>

</div>

</body>
</html>
