
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand-Specific Homepage Designs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #fff;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            padding: 80px 100px;
            max-width: 600px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.8em;
            font-weight: 700;
            color: #163964;
            line-height: 1.1;
            margin: 0;
            padding: 0;
        }

        .checklist {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .checklist li {
            display: flex;
            align-items: flex-start;
            font-size: 1.2em;
            color: #333333;
            line-height: 1.4;
        }

        .check-icon {
            color: #26a9e0;
            font-size: 1.5em;
            margin-right: 15px;
            flex-shrink: 0;
            position: relative;
            top: 2px;
        }

        .highlight-blue {
            color: #26a9e0;
            text-decoration: underline;
            font-weight: 700;
        }

        .branding {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .logo-main {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.6em;
            font-weight: 700;
            color: #163964;
            margin: 0;
            padding: 0;
        }

        .logo-sub {
            font-family: 'Open Sans', sans-serif;
            font-size: 1.1em;
            color: #333333;
            margin: 0;
            padding: 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
                max-width: 100%;
                gap: 30px;
            }

            header h1 {
                font-size: 2.8em;
            }

            .checklist li {
                font-size: 1em;
            }

            .check-icon {
                font-size: 1.3em;
                margin-right: 10px;
            }

            .logo-main {
                font-size: 2em;
            }

            .logo-sub {
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                gap: 20px;
            }

            header h1 {
                font-size: 2.2em;
            }

            .checklist li {
                font-size: 0.9em;
            }

            .check-icon {
                font-size: 1.1em;
                margin-right: 10px;
            }

            .logo-main {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Brand-Specific<br>Homepage Designs</h1>
        </header>

        <main>
            <ul class="checklist">
                <li>
                    <i class="fa-solid fa-circle-check check-icon"></i>
                    <span>THE AVERAGE USER VISITS UP TO <span class="highlight-blue">130 WEBSITES</span> DAILY</span>
                </li>
                <li>
                    <i class="fa-solid fa-circle-check check-icon"></i>
                    <span><span class="highlight-blue">38% OF USERS NOTICE A WEBSITE'S LAYOUT AND NAVIGATION</span></span>
                </li>
            </ul>
        </main>

        <footer class="branding">
            <p class="logo-main">DIGITALSILK</p>
            <p class="logo-sub">We Grow Brands Online</p>
        </footer>
    </div>
</body>
</html>
