<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", sans-serif;
}

/* PAGE BACKGROUND */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020024,#001f4d,#000000);
}

/* CONTAINER */

.container{
padding:35px;
width:350px;
border-radius:14px;

background:linear-gradient(145deg,#0a1f44,#000000);

box-shadow:0 0 30px rgba(0,0,0,0.7);
color:white;
border:1px solid rgba(255,255,255,0.08);
}

/* TITLE */

h2{
text-align:center;
margin-bottom:20px;
color:#4da6ff;
}

/* LABEL */

label{
font-size:14px;
color:#bbb;
}

/* INPUT */

input{
width:100%;
padding:10px;
margin:8px 0 15px 0;
border:none;
border-radius:8px;

background:#08142e;
color:white;
outline:none;
}

select{
    width:100%;
    padding:10px 12px;
    background:rgba(255, 255, 255, 0.08);
    color:#ffffff;
    border:1px solid rgba(255, 255, 255, 0.15);
    border-radius:10px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:14px;
    outline:none;
    cursor:pointer;
    transition:0.3s ease;
}

select:focus{
    border-color:#4da6ff;
    box-shadow:0 0 8px rgba(77, 166, 255, 0.4);
}

select option{
    background:#0b1622;
    color:#ffffff;
}
/* BUTTON */

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;

background:linear-gradient(90deg,#0d6efd,#003c9e);

color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:linear-gradient(90deg,#0b5ed7,#002e7a);
}

</style>
</head>

<body>

<div class="container">

<h2>Signup</h2>

<form method="post" action="/myapp/user_signup_post">
{% csrf_token %}
<label>Name</label>
<input type="text"
       name="name"
       placeholder="Enter your name"
       pattern="[A-Za-z ]+"
       oninvalid="this.setCustomValidity('Name should contain only letters and spaces')"
       oninput="this.setCustomValidity('')"
       required>

<label for="designation">Designation:</label>
<select name="des" id="designation" required>
    <option value="">Select Designation</option>
    <option value="Student">Student</option>
    <option value="Educator">Educator</option>
    <option value="Developer">Developer</option>
    <option value="UI/UX Designer">UI/UX Designer</option>
    <option value="Freelancer">Freelancer</option>
    <option value="Others">Others</option>
</select>

<label>Email</label>
<input type="text"  name="email"
       pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"
       placeholder="example@domain.com" required
       title="Please enter a valid email address (e.g., user@example.com)">

<label>Phone Number</label>
<input type="tel"
       name="phn"
       placeholder="Enter phone number"
       pattern="[0-9]{10}"
       oninvalid="this.setCustomValidity('Please enter a valid 10-digit phone number')"
       oninput="this.setCustomValidity('')"
       required>

<label>Username</label>
<input type="text"
       name="user"
       placeholder="Enter username"
       pattern="[A-Za-z0-9_]{4,15}"
       oninvalid="this.setCustomValidity('Username must be 4-15 characters and contain only letters, numbers, or underscore')"
       oninput="this.setCustomValidity('')"
       required>

<label>Password</label>
<input type="password"
       name="password"
       placeholder="Enter password"
       pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"
       oninvalid="this.setCustomValidity('Password must contain 8 characters, uppercase, lowercase, number and special character')"
       oninput="this.setCustomValidity('')"
       required>

<button type="submit">Signup</button>

</form>

</div>

</body>
</html>
