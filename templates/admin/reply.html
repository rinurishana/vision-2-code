{#<!DOCTYPE html>#}
{#<html lang="en">#}
{#<head>#}
{#<meta charset="UTF-8">#}
{#<title>Reply</title>#}

{% extends 'admin/admin_homenew.html' %}
{% block body %}


<style>

body{
    margin:0;
    padding:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#000000,#0a1f44);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Container box */
.container{
    width:450px;
    background:#0b132b;
    padding:35px;
    border-radius:12px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.8);
}

/* Heading */
.container h2{
    text-align:center;
    color:#ffffff;
    margin-bottom:25px;
    letter-spacing:1px;
}

/* Labels */
label{
    color:#cbd5e1;
    font-size:14px;
}

/* Input fields */
input, textarea{
    width:100%;
    padding:10px;
    margin-top:6px;
    margin-bottom:18px;
    border:none;
    border-radius:6px;
    background:#1c2541;
    color:white;
    outline:none;
}

/* Textarea size */
textarea{
    height:100px;
    resize:none;
}

/* Input focus */
input:focus, textarea:focus{
    background:#1f4068;
}

/* Button */
button{
    width:100%;
    padding:12px;
    background:#142850;
    border:none;
    border-radius:6px;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

/* Hover effect */
button:hover{
    background:#274690;
}
.back-link{
display:block;
margin-top:15px;
color:#aaa;
text-decoration:none;
}

.back-link:hover{
color:white;
}
</style>


<body>

<div class="container">

<h2>Reply to User</h2>

<form method="post" action="/myapp/admin_reply_post">

{% csrf_token %}


<label>Reply Message</label>
<textarea placeholder="Type your reply here..." name="message"></textarea>

<button type="submit">Send Reply</button>
<a href="/myapp/admin_home" class="back-link">← Back to Dashboard</a>
</form>

</div>

</body>


{% endblock %}
