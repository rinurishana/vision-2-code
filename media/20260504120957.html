
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand-Specific Homepage Designs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0V4LLanw2qksYuGWYNDqQ2BneFpWMf/ReP3eJtX6E6+6E+gA6sL4gDk3eXg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', 'Open Sans', 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.6;
            color: #333333;
            background-color: #f8f8f8; / A very light grey to provide a slight contrast to the white content box /
            display: flex;
            justify-content: flex-start; / Align content to the left side /
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; / Prevent horizontal scroll for small overlaps /
        }

        .content-container {
            background-color: #ffffff;
            padding: 80px 100px; / Matched from image analysis /
            width: 600px; / Approximate width of the content area in the image /
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); / Subtle shadow for depth, similar to image /
            position: absolute; / Position it on the left edge of the viewport /
            left: 0;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center; / Center content vertically within its container /
            align-items: flex-start; / Align content to the left /
        }

        .main-heading {
            font-size: 64px; / Exact size from image analysis /
            font-weight: 900; / Extra bold, approaching black /
            color: #1A3D6D; / Dark blue /
            margin-bottom: 40px; / Spacing below the title /
            line-height: 1.1;
        }

        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0;
            margin-bottom: 60px; / Spacing below the list /
        }

        .feature-item {
            display: flex;
            align-items: flex-start; / Align icon and text at the top /
            margin-bottom: 30px; / Spacing between list items /
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-icon {
            color: #36BBDE; / Light blue/cyan /
            font-size: 32px; / Adjust icon size to match image /
            margin-right: 20px; / Space between icon and text /
            flex-shrink: 0; / Prevent icon from shrinking on smaller screens /
            padding-top: 2px; / Adjust vertical alignment of icon with text /
        }

        .feature-text {
            font-size: 22px; / Text size /
            font-weight: 500; / Medium weight /
            color: #333333; / Darker grey for body text /
            line-height: 1.3;
        }

        .feature-underline {
            display: inline-block;
            border-bottom: 4px solid #36BBDE; / Thick light blue underline /
            padding-bottom: 2px; / Small gap between text and underline /
            line-height: 1; / Ensure underline is close to text /
            font-weight: 700; / Underlined text often appears a bit bolder /
        }

        .logo-block {
            margin-top: 60px; / Spacing above the logo /
            display: flex;
            flex-direction: column;
            align-items: flex-start; / Align logo content to the left /
        }

        .logo-digitalsilk {
            font-size: 38px; / Base size for 'SILK' part /
            font-weight: 700; / Bold for 'SILK' part /
            color: #1A3D6D; / Dark blue /
            letter-spacing: -1.5px; / Adjust for custom font look of the logo /
            line-height: 1;
        }

        .logo-digitalsilk .digital-part {
            font-weight: 400; / Lighter weight for "DIGITAL" part /
            font-size: 32px; / Slightly smaller for "DIGITAL" part /
            letter-spacing: normal; / Reset letter-spacing for this specific part /
        }

        .logo-tagline {
            font-size: 16px; / Tagline text size /
            color: #666666; / Grey for tagline /
            margin-top: 10px; / Space below logo text /
            font-weight: 400;
        }

        / Responsive adjustments /
        @media (max-width: 1200px) {
            .content-container {
                padding: 60px 80px;
                width: 500px;
            }
            .main-heading {
                font-size: 56px;
                margin-bottom: 30px;
            }
            .feature-text {
                font-size: 20px;
            }
            .feature-icon {
                font-size: 28px;
                margin-right: 15px;
            }
            .logo-digitalsilk {
                font-size: 34px;
            }
            .logo-digitalsilk .digital-part {
                font-size: 28px;
            }
            .logo-tagline {
                font-size: 15px;
            }
        }

        @media (max-width: 992px) {
            .content-container {
                position: relative; / Allow it to flow naturally in the document /
                width: 100%;
                max-width: 700px; / Max width for smaller desktops/laptops /
                padding: 50px 40px;
                box-sizing: border-box; / Include padding in width /
                min-height: auto; / Allow height to be determined by content /
                margin: 40px auto; / Center the container horizontally with vertical margin /
                left: auto; / Reset absolute positioning /
                top: auto;
                bottom: auto;
            }
            body {
                justify-content: center; / Center the content container /
                align-items: flex-start; / Align to top of viewport to prevent large vertical gaps if content is short /
            }
            .main-heading {
                font-size: 48px;
                margin-bottom: 25px;
            }
            .feature-text {
                font-size: 18px;
            }
            .feature-icon {
                font-size: 26px;
                margin-right: 12px;
            }
            .feature-item {
                margin-bottom: 25px;
            }
            .logo-digitalsilk {
                font-size: 30px;
            }
            .logo-digitalsilk .digital-part {
                font-size: 26px;
            }
            .logo-tagline {
                font-size: 14px;
            }
        }

        @media (max-width: 768px) {
            .content-container {
                padding: 40px 30px;
                margin: 30px auto;
            }
            .main-heading {
                font-size: 38px;
                margin-bottom: 20px;
            }
            .feature-text {
                font-size: 16px;
            }
            .feature-icon {
                font-size: 24px;
                margin-right: 10px;
            }
            .feature-item {
                margin-bottom: 20px;
            }
            .logo-digitalsilk {
                font-size: 26px;
            }
            .logo-digitalsilk .digital-part {
                font-size: 22px;
            }
            .logo-tagline {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .content-container {
                padding: 30px 20px;
                margin: 20px auto;
            }
            .main-heading {
                font-size: 32px;
            }
            .feature-text {
                font-size: 15px;
            }
            .feature-icon {
                font-size: 22px;
            }
            .logo-digitalsilk {
                font-size: 24px;
            }
            .logo-digitalsilk .digital-part {
                font-size: 20px;
            }
            .logo-tagline {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="content-container">
        <h1 class="main-heading">
            Brand-Specific<br>Homepage Designs
        </h1>

        <ul class="feature-list">
            <li class="feature-item">
                <i class="fas fa-check-circle feature-icon"></i>
                <p class="feature-text">
                    THE AVERAGE USER VISITS<br>
                    UP TO <span class="feature-underline">130 WEBSITES</span> DAILY
                </p>
            </li>
            <li class="feature-item">
                <i class="fas fa-check-circle feature-icon"></i>
                <p class="feature-text">
                    <span class="feature-underline">38% OF USERS NOTICE</span> A<br>
                    WEBSITE'S LAYOUT AND<br>
                    NAVIGATION
                </p>
            </li>
        </ul>

        <div class="logo-block">
            <p class="logo-digitalsilk">
                <span class="digital-part">DIGITAL</span>SILK
            </p>
            <p class="logo-tagline">
                We Grow Brands Online
            </p>
        </div>
    </div>
</body>
</html>
