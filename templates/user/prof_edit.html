<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Profile</title>

<style>
/* SUCCESS MESSAGE */

.message{
margin-bottom:20px;
padding:12px;
border-radius:8px;
text-align:center;
font-weight:500;
}

/* SUCCESS STYLE */

.success{
background:rgba(0, 200, 83, 0.15);
border:1px solid #00c853;
color:#00e676;
}
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", sans-serif;
}

/* BACKGROUND */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020024,#001f4d,#000000);
}

/* CONTAINER */

.container{
width:500px;
padding:30px;
border-radius:14px;

background:linear-gradient(145deg,#0a1f44,#000000);

box-shadow:0 0 30px rgba(0,0,0,0.7);
color:white;
border:1px solid rgba(255,255,255,0.08);
}

/* TITLE */

h2{
text-align:center;
margin-bottom:25px;
color:#4da6ff;
}

/* INPUT GROUP */

.form-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:6px;
color:#4da6ff;
font-size:14px;
}

/* INPUT FIELD */

input{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid rgba(255,255,255,0.1);
background:#08142e;
color:#fff;
outline:none;
}

input:focus{
border:1px solid #4da6ff;
}

select{
    width:100%;
    padding:10px 12px;
    background:rgba(255, 255, 255, 0.08);
    color:#ffffff;
    border:1px solid rgba(255, 255, 255, 0.15);
    border-radius:10px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:14px;
    outline:none;
    cursor:pointer;
    transition:0.3s ease;
}

select:focus{
    border-color:#4da6ff;
    box-shadow:0 0 8px rgba(77, 166, 255, 0.4);
}

select option{
    background:#0b1622;
    color:#ffffff;
}
/* BUTTON */

.button-group{
margin-top:25px;
display:flex;
justify-content:center;
}

.btn{
padding:10px 25px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:500;
background:linear-gradient(90deg,#00c853,#006400);
color:white;
}

.btn:hover{
background:linear-gradient(90deg,#00e676,#008000);
}

/* BACK LINK */

.back-link{
display:block;
margin-top:15px;
text-align:center;
color:white;
text-decoration:none;
}

.back-link:hover{
color:#4da6ff;
}

</style>
</head>

<body>

<div class="container">

<h2>Edit Profile</h2>
{% if messages %}
    {% for message in messages %}
        <div class="message success">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
<form method="post" action="/myapp/user_prof_edit_post">
{% csrf_token %}

<div class="form-group">
<label>Name</label>
<input type="text"
       name="name"
       placeholder="Enter your name"
       pattern="[A-Za-z ]+"
       oninvalid="this.setCustomValidity('Name should contain only letters and spaces')"
       oninput="this.setCustomValidity('')"
       required>
</div>

<div class="form-group">
<label for="designation">Designation:</label>
<select name="des" id="designation" required>
    <option value="">Select Designation</option>
    <option value="Student">Student</option>
    <option value="Educator">Educator</option>
    <option value="Developer">Developer</option>
    <option value="UI/UX Designer">UI/UX Designer</option>
    <option value="Freelancer">Freelancer</option>
    <option value="Others">Others</option>
</select></div>

<div class="form-group">
<label>Email</label>
<input type="text"  name="email"
       pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"
       placeholder="example@domain.com" required
       title="Please enter a valid email address (e.g., user@example.com)"></div>
<div class="form-group">

<label>Phone</label>
<input type="tel"
       name="phn"
       placeholder="Enter phone number"
       pattern="[0-9]{10}"
       oninvalid="this.setCustomValidity('Please enter a valid 10-digit phone number')"
       oninput="this.setCustomValidity('')"
       required>
</div>

<div class="button-group">
<button type="submit" class="btn">Update</button>
</div>

</form>

<a href="/myapp/user_home" class="back-link">← Back to Dashboard</a>

</div>

</body>
</html>
