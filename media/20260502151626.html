
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Home Screen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --iphone-bg: #fcf1d8; / Light yellow/beige /
            --status-bar-color: black;
            --app-label-color: black;
            --badge-bg: #ff3b30; / Red /
            --badge-text-color: white;
            --app-icon-size: 60px; / Base size for icons /
            --grid-gap: 15px;
            --dock-bg: rgba(255, 255, 255, 0.6); / Frosted glass effect /
            --dock-border-radius: 30px;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #333; / Dark background for the outside of the phone /
            font-family: 'Inter', -apple-system, BlinkMacMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .iphone-screen {
            width: 375px; / iPhone X/XS/11 Pro/12 mini width in CSS pixels /
            height: 812px; / iPhone X/XS/11 Pro/12 mini height in CSS pixels /
            background-color: var(--iphone-bg);
            border-radius: 40px; / Larger border-radius for the entire phone frame /
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            color: var(--status-bar-color);
            font-size: 14px;
            font-weight: 500;
        }

        .status-bar .left {
            display: flex;
            align-items: center;
        }

        .status-bar .left svg {
            width: 14px;
            height: 14px;
            margin-right: 5px;
        }

        .status-bar .right {
            display: flex;
            align-items: center;
        }

        .status-bar .right .battery-icon {
            width: 22px;
            height: 10px;
            border: 1px solid var(--status-bar-color);
            border-radius: 2px;
            margin-left: 5px;
            position: relative;
        }

        .status-bar .right .battery-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -3px;
            transform: translateY(-50%);
            width: 1px;
            height: 4px;
            background-color: var(--status-bar-color);
            border-radius: 1px;
        }

        .status-bar .right .battery-fill {
            height: 100%;
            width: 18%; / Example fill /
            background-color: #fcc400; / Yellow for low battery /
            border-radius: 1px;
        }

        .app-grid {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--grid-gap);
            padding: 20px;
            align-content: start; / Align rows to the start /
        }

        .app-icon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; / Align icon to top, text below /
            text-align: center;
            position: relative;
            padding-top: 5px; / Space for badges /
        }

        .app-icon {
            width: var(--app-icon-size);
            height: var(--app-icon-size);
            border-radius: 14px; / iOS app icon corner radius /
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), / Inner light border /
                        0 2px 2px rgba(0, 0, 0, 0.1); / Subtle shadow for depth /
        }

        .app-icon svg {
            width: 80%;
            height: 80%;
        }

        .app-label {
            margin-top: 5px;
            font-size: 11px;
            color: var(--app-label-color);
            line-height: 1.2;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3); / Subtle text shadow /
        }

        .badge {
            position: absolute;
            top: 0;
            right: 0; / Adjust as needed for alignment /
            background-color: var(--badge-bg);
            color: var(--badge-text-color);
            font-size: 10px;
            font-weight: 600;
            min-width: 18px; / For single digit /
            height: 18px;
            border-radius: 9px; / Half of height for perfect oval /
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 5px;
            box-sizing: border-box;
            border: 1px solid var(--iphone-bg); / Border to match background /
            transform: translate(30%, -30%); / Overlap corner /
            z-index: 10;
        }

        .page-indicator {
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }

        .page-indicator .dot {
            width: 6px;
            height: 6px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            margin: 0 3px;
        }

        .page-indicator .dot.active {
            background-color: rgba(0, 0, 0, 0.4);
        }

        .dock {
            width: calc(100% - 40px); / Account for padding /
            height: 90px; / Slightly taller for padding /
            background: var(--dock-bg);
            backdrop-filter: blur(20px); / Frosted glass effect /
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--dock-border-radius);
            margin: 0 20px 20px 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 10px;
            box-sizing: border-box;
            align-items: center;
            justify-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        / Specific App Icon Styles /

        .app-icon.calendar {
            background-color: white;
            flex-direction: column;
            padding-top: 8px;
            box-sizing: border-box;
            justify-content: flex-start;
        }
        .app-icon.calendar .day-of-week {
            font-size: 9px;
            font-weight: 500;
            color: #8c8c8c;
            margin-bottom: -2px;
        }
        .app-icon.calendar .date {
            font-size: 32px;
            font-weight: 700;
            color: black;
            line-height: 1;
        }

        .app-icon.clock { background-color: black; }
        .app-icon.clock .clock-face {
            width: 80%;
            height: 80%;
            border: 2px solid white;
            border-radius: 50%;
            position: relative;
            box-sizing: border-box;
        }
        .app-icon.clock .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .app-icon.clock .hour-hand,
        .app-icon.clock .minute-hand,
        .app-icon.clock .second-hand {
            position: absolute;
            background-color: white;
            transform-origin: bottom center;
            top: 50%;
            left: 50%;
        }
        .app-icon.clock .hour-hand {
            width: 2px;
            height: 30%;
            transform: translate(-50%, -100%) rotate(240deg); / Approx 6:48 /
        }
        .app-icon.clock .minute-hand {
            width: 2px;
            height: 40%;
            transform: translate(-50%, -100%) rotate(300deg); / Approx 6:48 /
        }
        .app-icon.clock .second-hand {
            width: 1px;
            height: 45%;
            background-color: red;
            transform: translate(-50%, -100%) rotate(180deg); / Arbitrary /
        }
        .app-icon.camera { background-color: #d1d1d6; }
        .app-icon.photos { background-color: white; }
        .app-icon.weather {
            background: linear-gradient(135deg, #4da6ff, #007aff);
        }
        .app-icon.weather .sun {
            width: 20px;
            height: 20px;
            background-color: #ffcc00;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 0 2px #ffcc00;
            top: -8px;
            left: 10px;
        }
        .app-icon.weather .cloud {
            width: 35px;
            height: 15px;
            background-color: white;
            border-radius: 10px;
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
        }
        .app-icon.weather .cloud::before, .app-icon.weather .cloud::after {
            content: '';
            position: absolute;
            background-color: white;
            border-radius: 50%;
        }
        .app-icon.weather .cloud::before {
            width: 20px;
            height: 20px;
            top: -10px;
            left: 5px;
        }
        .app-icon.weather .cloud::after {
            width: 25px;
            height: 25px;
            top: -15px;
            right: 5px;
        }

        .app-icon.settings { background-color: #d1d1d6; }
        .app-icon.calculator { background-color: #d1d1d6; }
        .app-icon.facebook { background-color: #1877f2; }
        .app-icon.messenger { background-color: #007aff; } / Darker blue /
        .app-icon.whatsapp { background-color: #25d366; }
        .app-icon.twitter { background-color: #1da1f2; }
        .app-icon.instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
        }
        .app-icon.facetime { background-color: #34c759; }
        .app-icon.maps { background-color: #d1d1d6; } / Complex SVG for actual map details /
        .app-icon.youtube { background-color: #ff0000; }
        .app-icon.tv { background-color: black; }
        .app-icon.reminders {
            background-color: white;
            flex-direction: column;
            gap: 2px;
            padding: 10px 0;
            box-sizing: border-box;
        }
        .app-icon.reminders .item {
            display: flex;
            align-items: center;
            width: 80%;
        }
        .app-icon.reminders .item .circle {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .app-icon.reminders .item .line {
            height: 2px;
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 1px;
        }
        .app-icon.reminders .item:nth-child(1) .circle { background-color: #ff3b30; }
        .app-icon.reminders .item:nth-child(2) .circle { background-color: #ff9500; }
        .app-icon.reminders .item:nth-child(3) .circle { background-color: #007aff; }

        .app-icon.stocks { background-color: black; }
        .app-icon.books { background-color: #ff9500; }
        .app-icon.mail { background-color: #007aff; }
        .app-icon.podcasts { background: linear-gradient(135deg, #8a2be2, #a020f0); } / Purple gradient /
        .app-icon.app-store {
            background: linear-gradient(135deg, #007aff, #5856d6); / Blue/Purple gradient /
        }
        .app-icon.shortcuts {
            background: linear-gradient(135deg, #445693, #723c93, #b83f81, #d66459);
        }
        .app-icon.notes {
            background-color: white;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 5px;
            box-sizing: border-box;
            position: relative;
        }
        .app-icon.notes .top-stripe {
            width: 100%;
            height: 10px;
            background-color: #ffcc00;
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
            position: absolute;
            top: 0;
        }
        .app-icon.notes .lines-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 80%;
            margin-top: 10px; / Offset for top stripe /
        }
        .app-icon.notes .line {
            height: 2px;
            background-color: #e0e0e0;
            width: 100%;
        }

        / Dock Icons /
        .app-icon.compass {
            background-color: white;
        }
        .app-icon.compass .compass-outer {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 2px solid #ccc;
            position: relative;
        }
        .app-icon.compass .compass-center {
            width: 60%;
            height: 60%;
            background: linear-gradient(45deg, #007aff, #007aff, #1da1f2);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
        }
        .app-icon.compass .compass-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 80%;
            background-color: transparent;
            transform: translate(-50%, -50%) rotate(-45deg); / Example direction /
        }
        .app-icon.compass .compass-needle::before,
        .app-icon.compass .compass-needle::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 50%;
            left: 0;
        }
        .app-icon.compass .compass-needle::before {
            background-color: #ff3b30; / Red top /
            top: 0;
        }
        .app-icon.compass .compass-needle::after {
            background-color: white; / White bottom /
            bottom: 0;
        }

        .app-icon.phone { background-color: #34c759; }
        .app-icon.contacts { background-color: #d1d1d6; }
        .app-icon.music { background-color: white; }
    </style>
</head>
