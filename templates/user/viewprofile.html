<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View User Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", sans-serif;
}

/* PAGE BACKGROUND */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020024,#001f4d,#000000);
}

/* MAIN CONTAINER */

.container{
width:500px;
padding:30px;
border-radius:14px;

background:linear-gradient(145deg,#0a1f44,#000000);

box-shadow:0 0 30px rgba(0,0,0,0.7);
color:white;
border:1px solid rgba(255,255,255,0.08);
}

/* TITLE */

h2{
text-align:center;
margin-bottom:25px;
color:#4da6ff;
}

/* PROFILE FIELD */

.profile-item{
margin-bottom:18px;
padding:12px;
border-radius:8px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
}

.label{
font-size:13px;
color:#4da6ff;
margin-bottom:5px;
display:block;
}

.value{
font-size:15px;
color:#ddd;
}

/* BUTTONS */

.button-group{
margin-top:25px;
display:flex;
justify-content:center;
gap:15px;
}

.btn{
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:500;
text-decoration:none;
text-align:center;
}

/* EDIT BUTTON */

.edit-btn{
background:linear-gradient(90deg,#0d6efd,#003c9e);
color:white;
}

.edit-btn:hover{
background:linear-gradient(90deg,#1a75ff,#0052cc);
}

/* UPDATE BUTTON */

.update-btn{
background:linear-gradient(90deg,#00c853,#006400);
color:white;
}

.update-btn:hover{
background:linear-gradient(90deg,#00e676,#008000);
}

/* BACK LINK */

.back-link{
display:block;
margin-top:15px;
text-align:center;
color:white;
text-decoration:none;
}

.back-link:hover{
color:#4da6ff;
}

</style>
</head>

<body>

<div class="container">

<h2>User Profile</h2>

{% for i in users %}

<div class="profile-item">
<span class="label">Name</span>
<div class="value">{{ i.name }}</div>
</div>

<div class="profile-item">
<span class="label">Designation</span>
<div class="value">{{ i.designation }}</div>
</div>

<div class="profile-item">
<span class="label">Email</span>
<div class="value">{{ i.email }}</div>
</div>

<div class="profile-item">
<span class="label">Phone</span>
<div class="value">{{ i.phone }}</div>
</div>

{% endfor %}


<div class="button-group">
<a href="/myapp/user_prof_edit" class="btn edit-btn">Edit</a>
{#<a href="/myapp/update_profile" class="btn update-btn">Update</a>#}
</div>

<a href="/myapp/user_home" class="back-link">← Back to Dashboard</a>

</div>

</body>
</html>
