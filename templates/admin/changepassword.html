{% extends 'admin/admin_homenew.html' %}
{% block body %}


<style>

body{
    margin:0;
    padding:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#000000,#0a1f44);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Main box */
.container{
    width:380px;
    background:#0b132b;
    padding:35px;
    border-radius:12px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.8);
}

/* Heading */
.container h2{
    text-align:center;
    color:#ffffff;
    margin-bottom:25px;
    letter-spacing:1px;
}

/* Labels */
label{
    color:#cbd5e1;
    font-size:14px;
}

/* Input fields */
input{
    width:100%;
    padding:10px;
    margin-top:6px;
    margin-bottom:18px;
    border:none;
    border-radius:6px;
    background:#1c2541;
    color:white;
    outline:none;
}

/* Input focus */
input:focus{
    background:#1f4068;
}

/* Button */
button{
    width:100%;
    padding:12px;
    background:#142850;
    border:none;
    border-radius:6px;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

/* Button hover */
button:hover{
    background:#274690;
}
.back-link{
display:block;
margin-top:15px;
color:#aaa;
text-decoration:none;
}

.back-link:hover{
color:white;
}
</style>


<body>

<div class="container">

<h2>Change Password</h2>

{% include "msgalert.html" %}


<form method="post" action="/myapp/admin_change_p_post">
{% csrf_token %}
<div class="input-group">
<i class="fa fa-lock"></i>
<input type="password" placeholder="Current Password"  required name="current_password" >
</div>

<div class="input-group">
<i class="fa fa-key"></i>
<input type="password" placeholder="New Password"  name="new_password"
           pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"
           oninvalid="this.setCustomValidity('Password must contain 8 characters, uppercase, lowercase, number and special character')"
           oninput="this.setCustomValidity('')"
           required>
</div>

<div class="input-group">
<i class="fa fa-check-circle"></i>
<input type="password" placeholder="Confirm New Password"  name="confirm_password"
           pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"
           oninvalid="this.setCustomValidity('Password must contain 8 characters, uppercase, lowercase, number and special character')"
           oninput="this.setCustomValidity('')"
           required>
</div>
<button type="submit">Update Password</button>
    <a href="/myapp/admin_home" class="back-link">← Back to Dashboard</a>
</form>

</div>

</body>


{% endblock %}
