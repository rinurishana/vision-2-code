<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generate Code | Vision2Code</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


/* Background */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
color:white;
}

/* Container */

.container{
text-align:center;
width:900px;
}

/* Heading */

.container h1{
margin-bottom:50px;
font-size:40px;
letter-spacing:1px;
}

/* Card Wrapper */

.card-wrapper{
display:flex;
justify-content:center;
gap:50px;
}

/* Glass Cards */

.card{
width:280px;
padding:45px 25px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,0.2);
border-radius:16px;

transition:0.4s;
cursor:pointer;
}

/* Hover */

.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 0 25px rgba(59,130,246,0.6);
}



/* Icons */

.card i{
font-size:55px;
margin-bottom:20px;
color:#60a5fa;
}

/* Title */

.card h3{
margin-bottom:25px;
font-weight:500;
}

/* Button */

.card button{
padding:12px 26px;
border:none;
border-radius:8px;

background:linear-gradient(45deg,#2563eb,#3b82f6);
color:white;

font-size:15px;
cursor:pointer;
transition:0.3s;
}

.card button:hover{
transform:scale(1.08);
box-shadow:0 0 12px #3b82f6;
}
.back-link{
display:block;
margin-top:15px;
color:white;
font-weight:500;
text-decoration:none;
}

.back-link:hover{
color:#4da6ff;
}

</style>
</head>

<body>

<div class="container">

<h1>Generate Code</h1>

<div class="card-wrapper">

<!-- Image to Code -->

<div class="card">
<i class="fa-solid fa-image"></i>
<h3>Generate Code from Image</h3>
<button onclick="location.href='/myapp/user_img_to_code'">
Generate
</button>
</div>

<!-- Text to Code -->

<div class="card">
<i class="fa-solid fa-code"></i>
<h3>Generate Code from Text</h3>
<button onclick="location.href='/myapp/user_text_to_code'">
Generate
</button>
</div>

</div>

<a href="/myapp/user_home" class="back-link">← Back to Dashboard</a>

</div>

</body>
</html>
