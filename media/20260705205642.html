<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        :root {
            --primary-color: #1967d9;
            --secondary-color: #4285f4;
            --background-dark: #1a1a2e;
            --card-background: #16213e;
            --text-white: #ffffff;
            --text-gray: #cccccc;
            --text-dark-gray: #aaaaaa;
            --border-color: #0f3460;
            --input-background: #0e1929;
            --google-background: #2b2b2b;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--background-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-white);
            overflow: hidden;
            background-image: url('dummy-background.jpg'); / Placeholder for background image /
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 2;
            background-color: var(--card-background);
            border-radius: 20px;
            padding: 40px 50px;
            width: 370px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .logo {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-white);
        }

        .tagline {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-gray);
            margin-bottom: 30px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-white);
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 10px;
        }

        .login-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background-color: var(--primary-color);
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dark-gray);
            font-size: 20px;
        }

        .input-field {
            width: calc(100% - 40px);
            padding: 15px 15px 15px 50px;
            border: none;
            border-radius: 10px;
            background-color: var(--input-background);
            color: var(--text-white);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-field::placeholder {
            color: var(--text-dark-gray);
        }

        .input-field:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-bottom: 15px;
        }

        .btn-login {
            background-color: var(--primary-color);
            color: var(--text-white);
            box-shadow: 0 5px 15px rgba(25, 103, 217, 0.4);
        }

        .btn-login:hover {
            background-color: #1976d2;
            transform: translateY(-2px);
        }

        .btn-google {
            background-color: var(--google-background);
            color: var(--text-white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-google:hover {
            background-color: #333333;
            transform: translateY(-2px);
        }

        .btn-google i {
            font-size: 24px;
        }

        .signup-prompt {
            font-size: 16px;
            color: var(--text-gray);
            margin-top: 20px;
        }

        .signup-link {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        .logo-svg {
            display: inline-block;
            vertical-align: middle;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="login-container">
        <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z" fill="#4285f4"/>
            <path d="M10.576 14.211a1.034 1.034 0 0 1 1.078.968l.005.112c0 .307-.122.597-.323.803l-2.542 2.542c-1.333 1.334-3.502 1.334-4.835 0a6.85 6.85 0 0 1-2.023-4.815 6.85 6.85 0 0 1 1.745-4.563c1.08-1.167 2.54-1.826 4.022-1.826.546 0 1.088.076 1.615.227.734.213 1.406.572 1.974 1.073l1.423-1.423a10.07 10.07 0 0 0-2.488-1.524c-1.36-.457-2.787-.644-4.233-.558a8.944 8.944 0 0 0-5.687 2.307c-2.17 1.928-3.374 4.712-3.374 7.632 0 2.919 1.196 5.703 3.374 7.632a8.947 8.947 0 0 0 5.687 2.307c1.446-.086 2.873-.273 4.233-.558a10.07 10.07 0 0 0 2.488-1.524l-1.423-1.423c-.568.501-1.24.86-1.974 1.073-.527.151-1.069.227-1.615.227-.971-.001-1.903-.293-2.686-.832a2.543 2.543 0 0 1-.782-1.796l-.005-.112a1.034 1.034 0 0 1 .968-1.073h.112z" fill="#0095ff"/>
            <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#f9ab00"/>
        </svg>
        <div class="brand-name">Vision2Code</div>
        <div class="tagline">Login</div>
        <h2 class="login-title">Login</h2>
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" class="input-field" placeholder="Enter Username">
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" class="input-field" placeholder="Enter Password">
        </div>
        <button class="btn btn-login">Login</button>
        <button class="btn btn-google">
            <i class="fab fa-google"></i>
            Sign up with Google
        </button>
        <div class="signup-prompt">
            Not signed up yet? <a href="#" class="signup-link">Sign up now</a>
        </div>
    </div>
</body>
</html>
