<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", sans-serif;
}

/* OUTSIDE BACKGROUND */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020024,#001f4d,#000000);
}

/* BOX */

.container{
width:380px;
padding:35px;
border-radius:14px;

/* MIXED BLUE BLACK BOX BACKGROUND */

background:linear-gradient(145deg,#0a1f44,#000000);

box-shadow:0 0 30px rgba(0,0,0,0.7);
text-align:center;
color:white;
border:1px solid rgba(255,255,255,0.08);
}

/* TITLE */

.container h2{
margin-bottom:25px;
color:#4da6ff;
}

/* INPUT FIELD */

.input-group{
position:relative;
margin-bottom:18px;
}

.input-group input{
width:100%;
padding:12px 40px;
border:none;
border-radius:8px;
background:#08142e;
color:white;
outline:none;
font-size:14px;
}

/* ICON */

.input-group i{
position:absolute;
top:50%;
left:12px;
transform:translateY(-50%);
color:#4da6ff;
}

/* BUTTON */

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:linear-gradient(90deg,#0d6efd,#003c9e);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:linear-gradient(90deg,#0b5ed7,#002e7a);
}

/* BACK LINK */

.back-link{
display:block;
margin-top:15px;
color:#aaa;
text-decoration:none;
}

.back-link:hover{
color:white;
}

</style>
</head>

<body>

<div class="container">

<h2>Change Password</h2>

{% include "msgalert.html" %}


<form method="post" action="/myapp/user_change_p_post">
{% csrf_token %}
<div class="input-group">
<i class="fa fa-lock"></i>
<input type="password" placeholder="Current Password" required name="current_password">
</div>

<div class="input-group">
<i class="fa fa-key"></i>
<input type="password" placeholder="New Password" name="new_password"
           pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"
           oninvalid="this.setCustomValidity('Password must contain 8 characters, uppercase, lowercase, number and special character')"
           oninput="this.setCustomValidity('')"
           required>
</div>

<div class="input-group">
<i class="fa fa-check-circle"></i>
<input type="password" placeholder="Confirm New Password" name="confirm_password"
           pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"
           oninvalid="this.setCustomValidity('Password must contain 8 characters, uppercase, lowercase, number and special character')"
           oninput="this.setCustomValidity('')"
           required>
</div>

<button type="submit">Update Password</button>

<a href="/myapp/user_home" class="back-link">← Back to Dashboard</a>

</form>

</div>

</body>
</html>
