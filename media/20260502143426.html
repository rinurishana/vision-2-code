
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Home Screen</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0; / A neutral background for the 'device' itself /
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            overflow: hidden; / Prevent body scroll if screen is larger /
        }

        .iphone-screen {
            width: 375px; / Common iPhone X/XS/11 Pro width for demonstration /
            height: 812px; / Common iPhone X/XS/11 Pro height /
            background-color: #fbe6af; / The yellowish background from the image /
            border-radius: 40px; / Simulating phone bezels /
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        / Status Bar /
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .status-left, .status-center, .status-right {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .status-left {
            justify-content: flex-start;
        }
        .airplane-mode::before {
            content: "✈︎"; / Unicode for airplane /
            font-size: 16px;
            margin-right: 5px;
        }

        .status-center {
            justify-content: center;
        }

        .status-right {
            justify-content: flex-end;
            gap: 5px;
        }

        .battery-icon {
            width: 20px;
            height: 10px;
            border: 1px solid #333;
            border-radius: 2px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .battery-icon::after {
            content: "";
            width: 2px;
            height: 6px;
            background-color: #333;
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 1px;
        }

        .battery-fill {
            height: 100%;
            background-color: #333;
            border-radius: 1px;
        }

        / App Grid /
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px 15px;
            flex-grow: 1; / Allow grid to take available space /
            align-content: flex-start; / Align rows to the top /
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 5px;
            position: relative;
        }

        .app-icon {
            width: 60px; / Standard icon size /
            height: 60px;
            border-radius: 15px; / Rounded corners for app icons /
            background-color: #ccc; / Default placeholder background /
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px; / For text-based icons /
            color: white;
            position: relative; / For badge positioning /
            overflow: hidden; / Important for icons like Calendar/Clock /
        }

        .app-name {
            font-size: 12px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff3b30; / Red badge color /
            color: white;
            font-size: 10px;
            font-weight: bold;
            border-radius: 50%;
            min-width: 18px; / Allow badge to grow for larger numbers /
            height: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            padding: 0 4px;
            box-shadow: 0 0 0 1.5px #fbe6af; / Matches screen background /
        }

        / Page Indicators /
        .page-indicators {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            gap: 5px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
        }

        .dot.active {
            background-color: rgba(0, 0, 0, 0.4);
        }

        / Dock /
        .dock {
            background-color: rgba(255, 255, 255, 0.5); / Semi-transparent white /
            backdrop-filter: blur(10px); / Frosted glass effect /
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            margin: 0 15px 15px; / Margin from sides and bottom /
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            height: 80px; / Fixed height for the dock /
            align-items: center;
            justify-items: center;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3), 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .dock .app-item {
            gap: 0; / No gap between icon and name in dock /
        }
        .dock .app-icon {
            width: 65px; / Slightly larger icons in the dock /
            height: 65px;
        }
        .dock .app-name {
            display: none; / No names in the dock /
        }

        / Specific App Icon Styles /

        / Calendar /
        .app-icon.calendar {
            background-color: #fff;
            flex-direction: column;
            font-size: 10px;
            color: #333;
            padding-top: 5px;
        }
        .app-icon.calendar .day-of-week {
            font-weight: normal;
            font-size: 8px;
            margin-bottom: 2px;
        }
        .app-icon.calendar .day-number {
            font-weight: bold;
            font-size: 28px;
            line-height: 1;
        }

        / Clock /
        .app-icon.clock {
            background-color: #222;
            border: 1px solid #333;
            position: relative;
            border-radius: 15px;
        }
        .app-icon.clock::before { / Clock face /
            content: "";
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background-color: #fff;
            z-index: 1;
        }
        .app-icon.clock::after { / Center dot /
            content: "";
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #333;
            z-index: 5;
        }
        .app-icon.clock .hand {
            position: absolute;
            left: calc(50% - 1px);
            top: 50%;
            transform-origin: center bottom;
            background-color: #333;
            border-radius: 1px;
            z-index: 4;
        }
        .app-icon.clock .hour-hand {
            width: 2px;
            height: 18px;
            margin-top: -18px;
            transform: rotate(204deg); / 6:48 AM /
        }
        .app-icon.clock .minute-hand {
            width: 2px;
            height: 25px;
            margin-top: -25px;
            transform: rotate(288deg); / 6:48 AM /
        }
        .app-icon.clock .second-hand {
            width: 1px;
            height: 28px;
            margin-top: -28px;
            background-color: #f00;
            transform: rotate(180deg); / Assume 30 seconds /
            z-index: 3;
        }
        .app-icon.clock .num {
            position: absolute;
            color: #333;
            font-size: 7px;
            font-weight: bold;
            z-index: 2;
            transform: translate(-50%, -50%);
        }
        .app-icon.clock .num.n12 { top: 18%; left: 50%; }
        .app-icon.clock .num.n3 { top: 50%; right: 18%; left: auto; }
        .app-icon.clock .num.n6 { bottom: 18%; left: 50%; top: auto; }
        .app-icon.clock .num.n9 { top: 50%; left: 18%; }


        / Camera /
        .app-icon.camera {
            background-color: #b0b0b0;
            position: relative;
        }
        .app-icon.camera::before { / Lens /
            content: "";
            width: 30px;
            height: 30px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
        }
        .app-icon.camera::after { / Inner lens /
            content: "";
            width: 15px;
            height: 15px;
            background-color: #666;
            border-radius: 50%;
            position: absolute;
            border: 3px solid #b0b0b0;
        }
        .app-icon.camera .flash {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
        }


        / Photos - simple gradient /
        .app-icon.photos {
            background-image: radial-gradient(circle at top left, #ff5c5c, #ff9e5c, #ffff5c, #5cff5c, #5c5cff, #9e5cff);
        }

        / Weather /
        .app-icon.weather {
            background: linear-gradient(to bottom right, #5c9eff, #8fd1ff);
        }
        .app-icon.weather::before { / Cloud /
            content: "";
            width: 35px;
            height: 20px;
            background-color: #fff;
            border-radius: 10px;
            position: absolute;
            bottom: 15px;
            left: 10px;
            box-shadow: 10px 0 0 -2px #fff, 20px 0 0 -5px #fff;
        }
        .app-icon.weather::after { / Sun /
            content: "";
            width: 20px;
            height: 20px;
            background-color: #ffe08a;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            right: 15px;
            box-shadow: 0 0 10px #ffe08a;
        }

        / Settings /
        .app-icon.settings {
            background-color: #999;
            position: relative;
        }
        .app-icon.settings::before { / Gear /
            content: "";
            width: 40px;
            height: 40px;
            background-color: #f0f0f0;
            border-radius: 50%;
            position: absolute;
            transform: rotate(20deg); / Slight rotation /
        }
        .app-icon.settings::after { / Gear hole /
            content: "";
            width: 15px;
            height: 15px;
            background-color: #999;
            border-radius: 50%;
            position: absolute;
        }
        .app-icon.settings .tooth {
            position: absolute;
            background-color: #f0f0f0;
            width: 10px;
            height: 20px;
            transform-origin: 50% 50%;
            z-index: 1;
        }
        .app-icon.settings .tooth:nth-child(1) { transform: rotate(0deg) translate(0, -20px) rotate(-20deg); }
        .app-icon.settings .tooth:nth-child(2) { transform: rotate(60deg) translate(0, -20px) rotate(-20deg); }
        .app-icon.settings .tooth:nth-child(3) { transform: rotate(120deg) translate(0, -20px) rotate(-20deg); }
        .app-icon.settings .tooth:nth-child(4) { transform: rotate(180deg) translate(0, -20px) rotate(-20deg); }
        .app-icon.settings .tooth:nth-child(5) { transform: rotate(240deg) translate(0, -20px) rotate(-20deg); }
        .app-icon.settings .tooth:nth-child(6) { transform: rotate(300deg) translate(0, -20px) rotate(-20deg); }

        / Calculator /
        .app-icon.calculator {
            background-color: #999;
            padding: 5px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 3px;
        }
        .app-icon.calculator .button {
            background-color: #666;
            border-radius: 5px;
        }
        .app-icon.calculator .button.op {
            background-color: #ff9500;
        }
        .app-icon.calculator .button:nth-child(1) { / Display /
            background-color: #333;
            grid-column: span 3;
        }
        .app-icon.calculator .button:nth-child(2), .app-icon.calculator .button:nth-child(3), .app-icon.calculator .button:nth-child(4),
        .app-icon.calculator .button:nth-child(6), .app-icon.calculator .button:nth-child(7), .app-icon.calculator .button:nth-child(8),
        .app-icon.calculator .button:nth-child(10), .app-icon.calculator .button:nth-child(11), .app-icon.calculator .button:nth-child(12),
        .app-icon.calculator .button:nth-child(14), .app-icon.calculator .button:nth-child(15) {
            background-color: #888;
        }
        .app-icon.calculator .button:nth-child(5), .app-icon.calculator .button:nth-child(9), .app-icon.calculator .button:nth-child(13),
        .app-icon.calculator .button:nth-child(16), .app-icon.calculator .button:nth-child(17) {
            background-color: #ff9500;
        }


        / Facebook /
        .app-icon.facebook {
            background-color: #1877f2;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 40px;
            color: white;
        }
        .app-icon.facebook::before { content: "f"; }

        / Messenger /
        .app-icon.messenger {
            background: linear-gradient(to top right, #0084ff, #00c6ff);
            position: relative;
        }
        .app-icon.messenger::before { / Lightning bolt /
            content: "";
            position: absolute;
            width: 15px;
            height: 35px;
            background-color: #fff;
            clip-path: polygon(50% 0%, 20% 50%, 40% 50%, 10% 100%, 80% 50%, 60% 50%);
            transform: rotate(-10deg);
        }

        / WhatsApp /
        .app-icon.whatsapp {
            background-color: #25d366;
            position: relative;
        }
        .app-icon.whatsapp::before { / Speech bubble /
            content: "";
            width: 40px;
            height: 35px;
            background-color: #fff;
            border-radius: 50% 50% 50% 5px / 50% 50% 5px 50%;
            position: absolute;
            transform: rotate(-15deg);
        }
        .app-icon.whatsapp::after { / Phone icon /
            content: "✆"; / Unicode phone icon /
            color: #25d366;
            font-size: 20px;
            position: absolute;
            z-index: 1;
            transform: rotate(-15deg) translate(0, 0);
        }


        / Twitter /
        .app-icon.twitter {
            background-color: #1da1f2;
            position: relative;
        }
        .app-icon.twitter::before { / Bird shape (simplified) /
            content: "";
            width: 40px;
            height: 30px;
            background-color: #fff;
            clip-path: polygon(10% 80%, 0% 50%, 20% 40%, 40% 0%, 60% 30%, 80% 20%, 100% 30%, 80% 40%, 60% 60%, 40% 70%);
            transform: scale(0.6);
        }

        / Instagram /
        .app-icon.instagram {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
            position: relative;
        }
        .app-icon.instagram::before { / Camera body /
            content: "";
            width: 45px;
            height: 45px;
            border: 3px solid #fff;
            border-radius: 12px;
            position: absolute;
        }
        .app-icon.instagram::after { / Lens /
            content: "";
            width: 15px;
            height: 15px;
            border: 3px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            right: 15px;
        }
        .app-icon.instagram .dot { / Top-left dot /
            width: 5px;
            height: 5px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 10px;
        }

        / FaceTime /
        .app-icon.facetime {
            background-color: #38c147;
            position: relative;
        }
        .app-icon.facetime::before { / Video camera icon /
            content: "";
            width: 40px;
            height: 30px;
            border: 3px solid #fff;
            border-radius: 5px;
            position: absolute;
        }
        .app-icon.facetime::after { / Play triangle /
            content: "";
            width: 0;
            height: 0;
            border-left: 15px solid #fff;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            position: absolute;
            left: calc(50% + 2px); / Adjust position /
            transform: translateX(-50%);
        }

        / Maps /
        .app-icon.maps {
            background: linear-gradient(to bottom, #72c366 0%, #72c366 50%, #b2d6ff 50%, #b2d6ff 100%); / Green top, blue bottom /
            position: relative;
        }
        .app-icon.maps::before { / Map pointer /
            content: "";
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50% 50% 50% 0; / Tear-drop shape /
            position: absolute;
            top: 15px;
            left: calc(50% - 10px);
            z-index: 3;
            transform: rotate(-45deg);
            border: 2px solid #007aff;
            box-sizing: border-box;
        }
        .app-icon.maps::after { / Highway sign 280 /
            content: "280";
            width: 20px;
            height: 20px;
            background-color: #007aff;
            border-radius: 5px;
            position: absolute;
            top: 35px;
            left: calc(50% + 5px);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
        }

        / YouTube /
        .app-icon.youtube {
            background-color: #fff;
            position: relative;
        }
        .app-icon.youtube::before { / Red rectangle /
            content: "";
            width: 45px;
            height: 30px;
            background-color: #ff0000;
            border-radius: 8px;
            position: absolute;
        }
        .app-icon.youtube::after { / Play triangle /
            content: "";
            width: 0;
            height: 0;
            border-left: 15px solid #fff;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            position: absolute;
            left: calc(50% + 2px); / Adjust position /
            transform: translateX(-50%);
        }

        / TV /
        .app-icon.tv {
            background-color: #000;
            color: white;
            font-size: 28px;
            position: relative;
        }
        .app-icon.tv::before { / Apple logo, simpler representation /
            content: ""; / Unicode Apple logo /
            font-family: sans-serif; / Fallback font /
            font-size: 30px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            color: #fff;
        }
        .app-icon.tv .text {
            position: absolute;
            bottom: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: -1px;
        }


        / Reminders /
        .app-icon.reminders {
            background-color: #fff;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .app-icon.reminders .line-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .app-icon.reminders .circle {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .app-icon.reminders .circle.red { background-color: #ff3b30; }
        .app-icon.reminders .circle.blue { background-color: #007aff; }
        .app-icon.reminders .circle.orange { background-color: #ff9500; }
        .app-icon.reminders .line {
            height: 2px;
            width: 30px;
            background-color: #ccc;
            border-radius: 1px;
        }

        / Stocks /
        .app-icon.stocks {
            background-color: #000;
            position: relative;
        }
        .app-icon.stocks::before { / Area fill /
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            clip-path: polygon(0 80%, 15% 65%, 30% 75%, 45% 50%, 60% 60%, 75% 35%, 90% 45%, 100% 20%, 100% 100%, 0% 100%);
            background-color: rgba(0, 122, 255, 0.4);
            top: 0;
            left: 0;
        }
        .app-icon.stocks::after { / Main line /
            content: "";
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: #007aff;
            clip-path: polygon(0 80%, 15% 65%, 30% 75%, 45% 50%, 60% 60%, 75% 35%, 90% 45%, 100% 20%);
            top: 0;
            left: 0;
        }
        .app-icon.stocks .current-point {
            width: 8px;
            height: 8px;
            background-color: #007aff;
            border-radius: 50%;
            position: absolute;
            bottom: 25px; / Adjust based on path end /
            right: 5px;
            border: 2px solid #000;
        }


        / Books /
        .app-icon.books {
            background-color: #ff9500;
            position: relative;
        }
        .app-icon.books::before { / Left page /
            content: "";
            width: 25px;
            height: 45px;
            background-color: #fff;
            border-radius: 0 5px 5px 0;
            position: absolute;
            left: 10px;
        }
        .app-icon.books::after { / Right page /
            content: "";
            width: 25px;
            height: 45px;
            background-color: #fff;
            border-radius: 5px 0 0 5px;
            position: absolute;
            right: 10px;
            border-left: 1px solid #ccc;
        }
        .app-icon.books .spine {
            width: 5px;
            height: 50px;
            background-color: #e07b00;
            position: absolute;
            top: 5px;
            z-index: 1;
        }

        / Mail /
        .app-icon.mail {
            background-color: #007aff;
            position: relative;
        }
        .app-icon.mail::before { / Envelope body /
            content: "";
            width: 45px;
            height: 30px;
            background-color: #fff;
            border-radius: 5px;
            position: absolute;
        }
        .app-icon.mail::after { / Envelope flap /
            content: "";
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-bottom: 15px solid #fff;
            position: absolute;
            top: 7px;
            z-index: 1;
            transform: translateY(-50%);
        }
        .app-icon.mail .v-line {
            width: 2px;
            height: 18px;
            background-color: #ccc;
            position: absolute;
            top: 15px;
            z-index: 2;
        }
        .app-icon.mail .v-line:nth-child(1) {
            transform: rotate(45deg);
            left: calc(50% - 10px);
        }
        .app-icon.mail .v-line:nth-child(2) {
            transform: rotate(-45deg);
            left: calc(50% + 10px);
        }
        .app-icon.mail .envelope-top-line {
            position: absolute;
            width: 45px;
            height: 2px;
            background-color: #ccc;
            top: 20px;
            z-index: 2;
        }

        / Podcasts /
        .app-icon.podcasts {
            background: linear-gradient(135deg, #a73fee 0%, #d845e2 50%, #ea5c5b 100%);
            position: relative;
        }
        .app-icon.podcasts::before { / Mic stand /
            content: "";
            width: 8px;
            height: 25px;
            background-color: #fff;
            border-radius: 4px;
            position: absolute;
            bottom: 10px;
            left: calc(50% - 4px);
            transform-origin: bottom center;
            transform: rotate(10deg);
        }
        .app-icon.podcasts::after { / Mic head /
            content: "";
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: calc(50% - 10px);
            transform: rotate(10deg);
            box-shadow: inset 0 0 0 3px #ccc;
        }
        .app-icon.podcasts .waveform {
            position: absolute;
            width: 100%;
            height: 100%;
            clip-path: polygon(
                10% 50%, 20% 40%, 30% 60%, 40% 30%, 50% 70%, 60% 35%, 70% 65%, 80% 45%, 90% 55%,
                90% 70%, 80% 60%, 70% 80%, 60% 50%, 50% 80%, 40% 45%, 30% 75%, 20% 50%, 10% 70%
            );
            background-color: rgba(255, 255, 255, 0.2);
        }


        / App Store /
        .app-icon.app-store {
            background-color: #007aff;
            position: relative;
        }
        .app-icon.app-store::before { / Stylized A/Arrow shape /
            content: "";
            width: 40px;
            height: 40px;
            background-color: white;
            position: absolute;
            clip-path: polygon(50% 0%, 100% 50%, 75% 50%, 75% 100%, 25% 100%, 25% 50%, 0% 50%);
            transform: scale(0.75) rotate(-45deg);
        }

        / Shortcuts /
        .app-icon.shortcuts {
            background: linear-gradient(135deg, #ff8c00, #ff2d55, #a282ff, #007aff);
            position: relative;
        }
        .app-icon.shortcuts::before { / Square 1 /
            content: "";
            width: 25px;
            height: 25px;
            background-color: #fff;
            border-radius: 5px;
            position: absolute;
            top: 15px;
            left: 15px;
            transform: rotate(20deg);
        }
        .app-icon.shortcuts::after { / Square 2 /
            content: "";
            width: 25px;
            height: 25px;
            background-color: #fff;
            border-radius: 5px;
            position: absolute;
            bottom: 15px;
            right: 15px;
            transform: rotate(20deg);
            opacity: 0.7;
        }

        / Notes /
        .app-icon.notes {
            background-color: #fff;
            border-radius: 15px;
            position: relative;
        }
        .app-icon.notes::before { / Yellow top bar /
            content: "";
            width: 100%;
            height: 10px;
            background-color: #ffcc00;
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: inset 0 0 0 1px #ffdd33;
            z-index: 1;
        }
        .app-icon.notes .line {
            width: 80%;
            height: 2px;
            background-color: #eee;
            margin: 5px auto;
            position: relative;
            top: 10px; / Offset from yellow bar /
        }
        .app-icon.notes .line:nth-child(2) { margin-top: 20px;} / This creates the blank space at the top for rings /
        .app-icon.notes .ring {
            width: 6px;
            height: 6px;
            background-color: #e0e0e0;
            border-radius: 50%;
            position: absolute;
            top: 18px; / Below yellow bar /
            z-index: 2;
        }
        .app-icon.notes .ring:nth-child(1) { left: 15px; }
        .app-icon.notes .ring:nth-child(2) { left: 50%; transform: translateX(-50%); }
        .app-icon.notes .ring:nth-child(3) { right: 15px; left: auto;}

        / Dock Icons /

        / Compass (Dock) /
        .app-icon.compass {
            background: radial-gradient(circle at center, #007aff, #005cbf);
            position: relative;
        }
        .app-icon.compass::before { / Compass face /
            content: "";
            width: 50px;
            height: 50px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
        }
        .app-icon.compass::after { / North pointer /
            content: "";
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 20px solid #ff3b30; / Red for North /
            position: absolute;
            top: 10px;
            transform: rotate(-15deg); / Slight tilt /
            z-index: 1;
        }
        .app-icon.compass .south-pointer {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 20px solid #b0b0b0; / Gray for South /
            position: absolute;
            bottom: 10px;
            transform: rotate(-15deg); / Slight tilt /
            z-index: 1;
        }
        .app-icon.compass .center-dot {
            width: 5px;
            height: 5px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            z-index: 2;
        }

        / Phone (Dock) /
        .app-icon.phone {
            background-color: #34c759;
            font-size: 35px;
        }
        .app-icon.phone::before { content: "✆"; color: white; transform: rotate(230deg); } / Unicode phone symbol /

        / Contacts (Dock) /
        .app-icon.contacts {
            background-color: #999;
            position: relative;
        }
        .app-icon.contacts::before { / Head /
            content: "";
            width: 25px;
            height: 25px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            z-index: 1;
        }
        .app-icon.contacts::after { / Body /
            content: "";
            width: 40px;
            height: 25px;
            background-color: #fff;
            border-radius: 20px 20px 0 0;
            position: absolute;
            bottom: 10px;
        }
        .app-icon.contacts .card-stack {
            position: absolute;
            width: 35px;
            height: 50px;
            background-color: #ccc;
            border-radius: 5px;
            transform: rotate(5deg) translateX(-10px);
            z-index: 0;
            box-shadow: 2px 2px 0 0 #b0b0b0, 4px 4px 0 0 #d0d0d0;
        }

        / Music (Dock) /
        .app-icon.music {
            background-color: #fff;
            position: relative;
        }
        .app-icon.music::before { / Eighth note head /
            content: "";
            width: 20px;
            height: 20px;
            background-color: #ff2d55;
            border-radius: 50%;
            position: absolute;
            bottom: 15px;
            left: calc(50% - 15px);
        }
        .app-icon.music::after { / Stem /
            content: "";
            width: 5px;
            height: 30px;
            background-color: #a282ff;
            border-radius: 2px;
            position: absolute;
            bottom: 25px;
            left: calc(50% + 5px);
            transform-origin: bottom center;
            transform: rotate(-20deg);
        }
        .app-icon.music .beam {
            width: 20px;
            height: 5px;
            background-color: #007aff;
            border-radius: 2px;
            position: absolute;
            top: 15px;
            right: calc(50% - 10px);
            transform: rotate(-20deg);
        }
    </style>
</head>
