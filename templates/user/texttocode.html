<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text to Code</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", sans-serif;
}

/* PAGE BACKGROUND */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020024,#001f4d,#000000);
}

/* CONTAINER */

.container{
width:420px;
padding:35px;
border-radius:14px;

background:linear-gradient(145deg,#0a1f44,#000000);

box-shadow:0 0 30px rgba(0,0,0,0.7);
color:white;
border:1px solid rgba(255,255,255,0.08);
}

/* TITLE */

h2{
text-align:center;
margin-bottom:20px;
color:#4da6ff;
}

/* LABEL */

label{
display:block;
margin-top:10px;
font-size:14px;
color:#bbb;
}

/* TEXTAREA */

textarea{
width:100%;
height:120px;
padding:12px;
margin-top:6px;

border:none;
border-radius:8px;

background:#08142e;
color:white;
outline:none;

resize:none;
}

/* SELECT */

select{
width:100%;
padding:10px;
margin:15px 0;

border:none;
border-radius:8px;

background:#08142e;
color:cornflowerblue;
outline:none;
}

/* BUTTON */

button{
width:100%;
padding:12px;

border:none;
border-radius:8px;

background:linear-gradient(90deg,#0d6efd,#003c9e);

color:lightsteelblue;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:linear-gradient(90deg,#0b5ed7,#002e7a);
}
    .back-link{
color:white;
text-decoration:none;
font-weight:500;
}

.back-link:hover{
color:#4da6ff;
}

</style>

</head>

<body>

<div class="container">

<h2>Text to Code</h2>

<form action="/myapp/user_text_to_code_post" method="post">

<label>Enter Text</label>

<textarea placeholder="Type your text here..." name="des" required></textarea>

<label>Select Output Type</label>

<select name="type" required>
<option value="">--Select Output Type--</option>
<option value="html">HTML</option>
<option value="flutter">Flutter</option>
<option value="react">React</option>
</select>

<button type="submit">Generate</button>
<a href="/myapp/user_home" class="back-link">← Back to Dashboard</a>
</form>

</div>

</body>
</html>
