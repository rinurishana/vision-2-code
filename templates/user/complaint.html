<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Complaints</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", sans-serif;
}

/* PAGE BACKGROUND */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020024,#001f4d,#000000);
}

/* MAIN CONTAINER */

.container{
width:720px;
padding:30px;
border-radius:14px;

background:linear-gradient(145deg,#0a1f44,#000000);

box-shadow:0 0 30px rgba(0,0,0,0.7);
color:white;
border:1px solid rgba(255,255,255,0.08);
}

/* TITLE */

h2{
text-align:center;
margin-bottom:20px;
color:#4da6ff;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
}

th, td{
border:1px solid rgba(255,255,255,0.1);
padding:10px;
text-align:center;
}

/* TABLE HEADER */

th{
background:linear-gradient(90deg,#0d6efd,#003c9e);
color:white;
}

/* TABLE ROW */

td{
background:#08142e;
color:#ddd;
}

/* DELETE BUTTON */

.delete-btn{
background:#dc3545;
color:white;
border:none;
padding:6px 12px;
border-radius:5px;
cursor:pointer;
transition:0.3s;
}

.delete-btn:hover{
background:#b52a37;
}

/* ADD NEW LINK */

.addnew{
display:block;
margin-top:15px;
text-align:right;
font-weight:bold;
text-decoration:none;
color:#4da6ff;
}

.addnew:hover{
color:white;
}

/* EMPTY MESSAGE */

#emptyMessage{
text-align:center;
padding:15px;
font-weight:bold;
color:#bbb;
display:none;
}
    .back-link{
color:white;
text-decoration:none;
font-weight:500;
}

.back-link:hover{
color:#4da6ff;
}

</style>
</head>

<body>

<div class="container">

<h2>Complaints</h2>

<table id="complaintTable">

<thead>
<tr>
<th>Date</th>
<th>Complaint</th>
<th>Admin Reply</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="complaintBody">

 {% for i in complaint %}
    <tr>
    <td>{{ i.date }}</td>
    <td>{{ i.complaint }}</td>
    <td>{{ i.reply }}</td>
    <td><button class="delete-btn" onclick="deleteRow(this)">Delete</button></td>

    </tr>
    {% endfor %}


</tr>

</tbody>

</table>

<div id="emptyMessage">No complaints available</div>

{#<a href="add_complaint.html" class="addnew">Add New</a>#}
<a href="/myapp/user_home" class="back-link">← Back to Dashboard</a>

</div>

<script>

function deleteRow(button){

let confirmDelete = confirm("Are you sure you want to delete this complaint?");

if(confirmDelete){

let row = button.parentNode.parentNode;
row.remove();

checkEmpty();

}

}

function checkEmpty(){

let body = document.getElementById("complaintBody");
let message = document.getElementById("emptyMessage");

if(body.rows.length === 0){
message.style.display = "block";
}else{
message.style.display = "none";
}

}

</script>

</body>
</html>
