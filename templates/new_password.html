<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Password</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", sans-serif;
}

/* BACKGROUND */

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#020024,#001f4d,#000000);
}

/* CONTAINER */

.container{
width:100%;
max-width:420px;
}

/* CARD */

.card{
background:linear-gradient(145deg, rgba(10,31,68,0.9), rgba(0,0,0,0.95));
backdrop-filter:blur(10px);

padding:30px;
border-radius:16px;

box-shadow:0 0 30px rgba(0,0,0,0.8),
           0 0 10px rgba(77,166,255,0.2);

border:1px solid rgba(255,255,255,0.08);
color:white;
}

/* TITLE */

.card-title{
text-align:center;
margin-bottom:20px;
color:#4da6ff;
}

/* LABEL */

.form-label{
color:#4da6ff;
font-size:14px;
}

/* INPUT */

.form-control{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid rgba(255,255,255,0.1);
background:#08142e;
color:#fff;
outline:none;
margin-top:5px;
}

.form-control:focus{
border:1px solid #4da6ff;
box-shadow:0 0 8px rgba(77,166,255,0.4);
}

/* BUTTON */

.btn{
width:100%;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:500;

background:linear-gradient(90deg,#00c853,#006400);
color:white;
transition:0.3s;
}

.btn:hover{
background:linear-gradient(90deg,#00e676,#008000);
box-shadow:0 0 10px rgba(0,200,83,0.5);
}

/* MESSAGE */

.message{
margin-bottom:15px;
padding:10px;
border-radius:6px;
text-align:center;
}

.success{
background:rgba(0,200,83,0.15);
border:1px solid #00c853;
color:#00e676;
}

.error{
background:rgba(255,0,0,0.15);
border:1px solid #ff1744;
color:#ff5252;
}

/* FOOTER TEXT */

.footer-text{
text-align:center;
margin-top:15px;
font-size:13px;
color:#aaa;
}

/* HOVER EFFECT */

.card:hover{
transform:translateY(-4px);
transition:0.3s;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h3 class="card-title">Enter New Password</h3>

<!-- DJANGO MESSAGE -->
{% if messages %}
{% for message in messages %}
<div class="message {{ message.tags }}">{{ message }}</div>
{% endfor %}
{% endif %}

<form action="/myapp/changePassword" method="post">
{% csrf_token %}

<div class="mb-3">
<label for="newPassword" class="form-label">New Password</label>
<input type="password" name="newPassword" id="newPassword" class="form-control" required>
</div>

<div class="mb-3">
<label for="confirmPassword" class="form-label">Confirm Password</label>
<input type="password" name="confirmPassword" id="confirmPassword" class="form-control" required>
</div>

<button type="submit" class="btn">Change</button>

</form>

</div>

<p class="footer-text">Make sure your new password is strong and secure.</p>

{% include 'msgalert.html' %}
{% block content %}{% endblock %}

</div>

</body>
</html>
