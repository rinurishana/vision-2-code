<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated HTML Viewer</title>


<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        min-height:100vh;
        background:linear-gradient(135deg,#050816,#0a1931,#000814);
        display:flex;
        justify-content:center;
        align-items:center;
        padding:30px;
        color:white;
    }

    .container{
        width:95%;
        max-width:1000px;
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.08);
        backdrop-filter:blur(14px);
        border-radius:20px;
        padding:25px;
        box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    h2{
        text-align:center;
        color:#66b3ff;
        margin-bottom:20px;
    }

    .code-box{
        width:100%;
        height:300px;
        background:#020b18;
        color:#d8eaff;
        border:1px solid rgba(102,179,255,0.3);
        border-radius:12px;
        padding:15px;
        resize:none;
        outline:none;
        font-size:14px;
        line-height:1.5;
    }

    .button-group{
        display:flex;
        justify-content:center;
        gap:15px;
        flex-wrap:wrap;
        margin-top:20px;
    }

    button{
        padding:12px 22px;
        border:none;
        border-radius:12px;
        background:linear-gradient(135deg,#0f3460,#1a1a2e);
        color:white;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        transform:translateY(-2px);
        background:linear-gradient(135deg,#1b4f8a,#16213e);
    }

    iframe{
        width:100%;
        height:350px;
        margin-top:25px;
        border:none;
        border-radius:15px;
        background:white;
    }

        .back-link{
color:white;
text-decoration:none;
font-weight:500;
}

.back-link:hover{
color:#4da6ff;
}

</style>

</head>

<body>

<div class="container">
    <h2>Generated Code</h2>


<!-- Code Display -->
<textarea id="codeArea" class="code-box">{{ data }}</textarea>

<!-- Buttons -->
<div class="button-group">
    <button type="button" onclick="copyCode()">Copy</button>
{#    <button type="button" onclick="runCode()">Run</button>#}
    <button type="button" onclick="goBack()">Back</button>
    <a href="/media/{{ fn }}" target="_blank"><button type="button">View Website </button></a>
    <a href="/myapp/user_img_his" class="back-link">← View generated </a>

</div>

<!-- Live Preview -->
{#<iframe id="preview"></iframe>#}


</div>

<script>
    function copyCode() {
        let code = document.getElementById("codeArea").value;

        navigator.clipboard.writeText(code)
            .then(() => alert("Code copied!"))
            .catch(() => alert("Copy failed"));
    }

    function runCode() {
        const code = document.getElementById("codeArea").value;
        const iframe = document.getElementById("preview");
        iframe.srcdoc = code;
    }

    function goBack() {
        window.location.href = "/myapp/user_img_to_code";
    }
</script>

</body>
</html>
