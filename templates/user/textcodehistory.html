<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image History</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", sans-serif;
}

/* PAGE BACKGROUND */

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
background:linear-gradient(135deg,#020024,#001f4d,#000000);
padding:30px 0;
overflow-y:auto;
}

/* CONTAINER */

.container{
padding:35px;
width:750px;
border-radius:14px;

background:linear-gradient(145deg,#0a1f44,#000000);

box-shadow:0 0 30px rgba(0,0,0,0.7);
color:white;
border:1px solid rgba(255,255,255,0.08);

max-height:90vh;
overflow-y:auto;
}

/* TITLE */

h2{
text-align:center;
margin-bottom:20px;
color:#4da6ff;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
}

th, td{
border:1px solid rgba(255,255,255,0.1);
padding:12px;
text-align:center;
}

/* TABLE HEADER */

th{
background:linear-gradient(90deg,#0d6efd,#003c9e);
color:white;
}

/* TABLE ROW */

td{
background:#08142e;
color:#ddd;
}

/* DELETE BUTTON */

.delete-btn{
background:#dc3545;
color:white;
border:none;
padding:6px 12px;
border-radius:5px;
cursor:pointer;
transition:0.3s;
}

.delete-btn:hover{
background:#b52a37;
}

   .back-link{
color:white;
text-decoration:none;
font-weight:500;
}
/* NEW GENERATION LINK */

.new-link{
display:block;
text-align:center;
margin-top:20px;
font-weight:bold;
color:white;
text-decoration:none;
}

.new-link:hover{
color:#4da6ff;
}
    .back-link{
color:white;
text-decoration:none;
font-weight:500;
}

.back-link:hover{
color:#4da6ff;
}

</style>

</head>

<body>

<div class="container" style="position: absolute">

<h2>Text History</h2>
<a href="/myapp/user_text_to_code"  style="position: relative;right: -293px;top: 20px" class="new-link">New Generation</a>
<a href="/myapp/user_home" class="back-link">← Back to Dashboard</a>
<table>

<tr>
<th>Text description </th>
<th>Output Format</th>
<th>Code</th>
<th>Date</th>
<th>Delete</th>
</tr>

 {% for i in text %}
    <tr>
    <td>{{ i.text_input }}</td>
    <td>{{ i.output_format }}</td>
    <td><a href="/media/{{ i.generated_code }}" download>Download</a> </td>
    <td>{{ i.date }}</td>
    <td><a href="" class="delete-btn">Delete</a></td>
    </tr>
    {% endfor %}




</table>


</div>

</body>
</html>
