<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homepage Designs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .main-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-image: url('https://via.placeholder.com/1920x1080/FFFFFF/000000?text=Placeholder+Image+of+Desk+with+Computers');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .content-left {
    position: relative;
    left: 10.5%;
    width: 35%;
    padding-top: 5vh;
    padding-bottom: 5vh;
  }

  .main-heading {
    font-family: 'Arial Black', Gadget, sans-serif;
    font-size: 3.9vw;
    font-weight: 900;
    color: #123164;
    line-height: 1.1;
    margin: 0 0 2.5vw 0;
  }

  .bullet-point {
    display: flex;
    align-items: flex-start;
    margin-bottom: 2vw;
  }

  .bullet-point i {
    color: #26a6d6;
    font-size: 1.6vw;
    margin-right: 0.8vw;
    position: relative;
    top: 0.15em;
    flex-shrink: 0;
  }

  .bullet-point p {
    font-size: 1.25vw;
    font-weight: 500;
    color: #2d3b50;
    line-height: 1.4;
    margin: 0;
    text-transform: uppercase;
    flex-grow: 1;
  }

  .bullet-point p span.underline {
    text-decoration: underline;
    text-decoration-color: #26a6d6;
    text-decoration-thickness: 0.15vw;
    text-underline-offset: 0.25em;
  }

  .logo-section {
    margin-top: 5.5vw;
  }

  .logo-text {
    font-family: 'Arial Black', Gadget, sans-serif;
    font-size: 2.7vw;
    font-weight: 900;
    color: #123164;
    margin: 0;
    letter-spacing: -0.05em;
  }

  .logo-tagline {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 1.25vw;
    font-weight: 400;
    color: #6a6a6a;
    margin: 0.2vw 0 0 0;
  }
</style>
</head>
<body>
<div class="main-container">
  <div class="content-left">
    <h1 class="main-heading">Brand-Specific<br>Homepage Designs</h1>
    <div class="bullet-point">
      <i class="fa-solid fa-circle-check"></i>
      <p>THE AVERAGE USER VISITS<br>UP TO <span class="underline">130 WEBSITES DAILY</span></p>
    </div>
    <div class="bullet-point">
      <i class="fa-solid fa-circle-check"></i>
      <p>38% OF USERS NOTICE A<br><span class="underline">WEBSITE'S LAYOUT AND</span><br><span class="underline">NAVIGATION</span></p>
    </div>
    <div class="logo-section">
      <h2 class="logo-text">DIGITALSILK</h2>
      <p class="logo-tagline">We Grow Brands Online</p>
    </div>
  </div>
</div>
</body>
</html>
