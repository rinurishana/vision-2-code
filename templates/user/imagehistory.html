<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image History</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", sans-serif;
}

/* PAGE BACKGROUND */

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
background:linear-gradient(135deg,#020024,#001f4d,#000000);
padding:30px 0;
overflow-y:auto;
}

/* CONTAINER */

.container{
padding:35px;
width:750px;
border-radius:14px;

background:linear-gradient(145deg,#0a1f44,#000000);

box-shadow:0 0 30px rgba(0,0,0,0.7);
color:white;
border:1px solid rgba(255,255,255,0.08);

 max-height:90vh;
 overflow-y:auto;
}

/* TITLE */

h2{
text-align:center;
margin-bottom:20px;
color:#4da6ff;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
}

th, td{
border:1px solid rgba(255,255,255,0.1);
padding:12px;
text-align:center;
}

/* TABLE HEADER */

th{
background:linear-gradient(90deg,#0d6efd,#003c9e);
color:white;
}

/* TABLE ROW */

td{
background:#08142e;
color:#ddd;
}

/* DELETE BUTTON */

.delete-btn{
background:#dc3545;
color:white;
border:none;
padding:6px 12px;
border-radius:5px;
cursor:pointer;
transition:0.3s;
}

.delete-btn:hover{
background:#b52a37;
}

/* NEW GENERATION LINK */

.new-link{
display:block;
text-align:center;
margin-top:20px;
font-weight:bold;
color:white;
text-decoration:none;
}

.new-link:hover{
color:#4da6ff;
}
    .back-link{
color:white;
text-decoration:none;
font-weight:500;
}

.back-link:hover{
color:#4da6ff;
}

</style>

</head>

<body>

<div class="container" style="position: absolute">
<h2>Image History</h2>
<a href="/myapp/user_img_to_code" style="position: relative;right: -293px;top: 20px" class="new-link">New Generation</a>
<a href="/myapp/user_home" class="back-link">← Back to Dashboard</a>


<table>

<tr>
<th>Image</th>
<th>Output File</th>
<th>Date</th>
<th>Delete</th>
</tr>

 {% for i in image %}
    <tr>
    <td><a href="/media/{{ i.image_path }}" target="_blank"><img src="/media/{{ i.image_path }}" width="200" height="100"/> </a> </td>
    <td><a href="/media/{{ i.output_file }}" download> {{ i.output_file }}</a></td>
    <td>{{ i.date }}</td>
    <td><button class="delete-btn" onclick="deleteRow(this)">Delete</button></td>
    </tr>
    {% endfor %}




</table>

</div>
<script>

function deleteRow(button){

let confirmDelete = confirm("Are you sure you want to delete this complaint?");

if(confirmDelete){

let row = button.parentNode.parentNode;
row.remove();

checkEmpty();

}

}
</script>
</body>
</html>
