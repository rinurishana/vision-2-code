<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Black Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-light: #e0e0e0;
            --text-placeholder: rgba(255, 255, 255, 0.6);
            --button-bg: rgba(30, 144, 255, 0.6); /* DodgerBlue with transparency */
            --button-hover-bg: rgba(30, 144, 255, 0.8);
            --glow-color: rgba(30, 144, 255, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #333333, #1a1a1a);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        .login-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            transform-style: preserve-3d;
            animation: fadeInScale 0.8s ease-out forwards;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 20px;
            background: linear-gradient(45deg, var(--glow-color), transparent, var(--glow-color));
            background-size: 200% 200%;
            opacity: 0;
            filter: blur(20px);
            z-index: -1;
            transition: opacity 0.3s ease;
            animation: pulseGlow 5s infinite alternate;
        }

        .login-container:hover::before {
            opacity: 0.3;
        }

        @keyframes pulseGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5em;
            color: var(--text-light);
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.4); /* DeepSkyBlue glow */
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 1em;
            color: var(--text-light);
        }

        .input-group input {
            width: calc(100% - 20px); /* Adjust for padding */
            padding: 12px 10px;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-light);
            font-size: 1em;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .input-group input::placeholder {
            color: var(--text-placeholder);
        }

        .input-group input:focus {
            border-color: var(--glow-color);
            box-shadow: 0 0 10px var(--glow-color), inset 0 1px 3px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.4);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: var(--button-bg);
            color: var(--text-light);
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        button:hover {
            background: var(--button-hover-bg);
            box-shadow: 0 0 20px var(--glow-color);
        }

        .links {
            margin-top: 25px;
            font-size: 0.9em;
        }

        .links a {
            color: var(--glow-color);
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .links a:hover {
            color: var(--text-light);
            text-shadow: 0 0 8px var(--glow-color);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form class="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Log In</button>
            <div class="links">
                <a href="#">Forgot Password?</a>
                <a href="#">Sign Up</a>
            </div>
        </form>
    </div>
</body>
</html>
