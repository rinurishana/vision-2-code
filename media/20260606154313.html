<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121829;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYwMCIgaGVpZ2h0PSIxMDAwIiB2aWV3Qm94PSIwIDAgMTYwMCAxMDAwIiBmaWxsPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPgogIDxwYXRoIGQ9Ik0wIDc3NS45ODlDNDMxLjAxNSAxMTc0LjEzIDExMTUuNTA1IDExNzQuMTMgMTYwMCA3NzUuOTg5VjEwMDBIMHoiIGZpbGw9IiMxYTU1NjciLz4KICA8cGF0aCBkPSJNMTYwMCA4MjUuNjg1QzExNjAuMDMxIDEyMjcuNDEgNjY2LjM3NiAxMjA2LjUwOSAxNjAwIDgyNS42ODVWMTAwMEgxNjAwWiIgZmlsbD0iIzE0M2IxOSIvPgo8L3N2Zz4=');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .login-container {
            background: rgba(24, 32, 48, 0.8);
            border-radius: 20px;
            padding: 40px 50px;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .logo svg {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        .logo-text {
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
        }

        .logo-text span {
            color: #50c8ff;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            color: #8fa0b5;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8fa0b5;
            font-size: 18px;
        }

        .input-field {
            width: calc(100% - 40px);
            padding: 15px 15px 15px 50px;
            background-color: rgba(32, 43, 63, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            box-sizing: border-box;
        }

        .input-field::placeholder {
            color: #8fa0b5;
        }

        .login-button {
            background: linear-gradient(90deg, #4b90ff, #00d4ff);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 15px 0;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: background 0.3s ease;
            box-shadow: 0 5px 15px rgba(75, 144, 255, 0.4);
        }

        .login-button:hover {
            background: linear-gradient(90deg, #3b80ee, #00c4ee);
        }

        .signup-google {
            background-color: rgba(32, 43, 63, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            transition: background 0.3s ease;
        }

        .signup-google:hover {
            background-color: rgba(40, 55, 75, 0.8);
        }

        .signup-google i {
            margin-right: 10px;
            font-size: 20px;
        }

        .signup-text {
            font-size: 14px;
            color: #8fa0b5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-text a {
            color: #50c8ff;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

            </svg>
            <span class="logo-text">Vision<span style="color: #50c8ff;">2</span>Code</span>
        </div>
        <div class="title">Login</div>
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" class="input-field" placeholder="Enter Username">
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" class="input-field" placeholder="Enter Password">
        </div>
        <button class="login-button">Login</button>
        <button class="signup-google">
            <i class="fab fa-google"></i>
            Sign up with Google
        </button>
        <div class="signup-text">
            Not signed up yet? <a href="#">Sign up now</a>
        </div>
    </div>
</body>
</html>
