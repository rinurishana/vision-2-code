<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Modern Page</title>
    <style>
        /* Basic Reset & Box Sizing */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Body Styling */
        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            background-color: #f8f9fa; /* Light gray background */
            color: #343a40; /* Dark gray text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Full viewport height */
            margin: 0;
        }

        /* Container Styling */
        .container {
            background-color: #ffffff; /* White content background */
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); /* Soft shadow */
            text-align: center;
            max-width: 90%;
            width: 500px; /* Max width for larger screens */
        }

        /* Heading Styling */
        h1 {
            font-size: 3em; /* Larger heading */
            color: #007bff; /* A nice blue color */
            margin-bottom: 20px;
            font-weight: 700; /* Bold heading */
            letter-spacing: -0.02em; /* Slightly tighter letter spacing */
        }

        /* Paragraph Styling (if used) */
        p {
            font-size: 1.2em;
            color: #6c757d; /* Lighter gray for paragraph text */
        }

        /* Optional: Add some hover effects or minor animations if more interaction was implied */
        h1:hover {
            color: #0056b3; /* Slightly darker blue on hover */
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>sdasda</h1>
        <!-- If "sdasda" was meant to be a paragraph or a longer text: -->
        <!-- <p>This is some descriptive text related to sdasda, showcasing a clean and modern design.</p> -->
    </div>
</body>
</html>
